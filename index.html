<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hlubiny</title>
<link rel="stylesheet" href="style.css?v=33e24dca">
</head>
<body class="v-menu">
<canvas id="platno" aria-label="Hlubiny"></canvas>

<div class="hud" aria-hidden="true">
  <div class="xp"><div id="xp-pruh" class="xp-pruh"></div></div>
  <div class="hud-radek">
    <span>Úroveň <b id="uroven">1</b></span>
    <span id="cas" class="cas">0:00</span>
    <span>Zabito <b id="zabito">0</b></span>
  </div>
</div>

<section id="menu" class="menu">
  <div class="menu-obsah">
    <canvas id="logo" class="logo pixel" role="img" aria-label="Hlubiny"></canvas>
    <p class="menu-podtitul">Přežij v hlubinách co nejdéle</p>
    <nav id="menu-volby" class="menu-volby" aria-label="Hlavní menu"></nav>
    <div id="menu-zalozka" class="menu-zalozka" hidden>
      <h2 id="menu-nadpis"></h2>
      <div id="menu-panel"></div>
      <button id="menu-zpet" class="menu-tlacitko" type="button">Zpět (Esc)</button>
    </div>
  </div>
  <p class="menu-pata">Šipky a Enter, klik nebo dotyk</p>
</section>

<section id="volba" class="okno" hidden>
  <h2>Nová úroveň</h2>
  <p class="podtitul">Vyber jedno vylepšení (klávesy 1–3)</p>
  <div id="karty" class="karty"></div>
</section>

<section id="konec" class="okno" hidden>
  <h2>Hlubiny tě pohltily</h2>
  <p id="konec-text" class="podtitul"></p>
  <div class="radek-tlacitek">
    <button id="znovu" class="menu-tlacitko" type="button">Znovu (R)</button>
    <button id="do-menu" class="menu-tlacitko" type="button">Menu (M)</button>
  </div>
</section>

<p class="napoveda">Pohyb: WASD, šipky nebo tah prstem · zbraně střílí samy · P pauza</p>

    "./src/ulozeni.js": "./src/ulozeni.js?v=2ded9112",
    "./src/zvuk.js": "./src/zvuk.js?v=0732305a"
  }
}
</script>
<script type="module" src="src/main.js?v=550c55c1"></script>
</body>
</html>
