<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RuGee</title>
<link rel="stylesheet" href="style.css?v=19807fec">
</head>
<body class="v-menu">
<canvas id="platno" aria-label="RuGee"></canvas>

<div class="hud" aria-hidden="true">
  <div class="xp"><div id="xp-pruh" class="xp-pruh"></div></div>
  <div class="hud-radek">
    <span>Úroveň <b id="uroven">1</b></span>
    <span id="cas" class="cas">0:00</span>
    <span>Zabito <b id="zabito">0</b><span class="hud-zlato"><i id="zlato-ikona"></i><b id="zlataky">0</b></span></span>
  </div>
</div>
<div id="vybava" class="vybava" aria-hidden="true"></div>

<section id="menu" class="menu">
  <div class="menu-obsah">
    <canvas id="logo" class="logo pixel" role="img" aria-label="RuGee"></canvas>
    <p class="menu-podtitul">Přežij v hlubinách co nejdéle</p>
    <nav id="menu-volby" class="menu-volby" aria-label="Hlavní menu"></nav>
    <div id="menu-zalozka" class="menu-zalozka" hidden>
      <h2 id="menu-nadpis"></h2>
      <div id="menu-panel"></div>
      <button id="menu-zpet" class="menu-tlacitko" type="button">Zpět (Esc)</button>
    </div>
  </div>
  <p class="menu-pata">Šipky a Enter, klik nebo dotyk</p>
</section>

<section id="volba" class="vyber" hidden>
  <div class="vyber-panel">
    <p id="volba-stitek" class="vyber-stitek">Úroveň 2</p>
    <h2 id="volba-nadpis">Nová úroveň</h2>
    <p class="podtitul"><span class="jen-klavesnice">Vyber jedno vylepšení (klávesy 1–3 nebo šipky a Enter)</span><span class="jen-dotyk">Klepni na jedno vylepšení</span></p>
    <div id="karty" class="karty"></div>
    <p id="volba-sance" class="vyber-sance"></p>
  </div>
</section>

<section id="konec" class="okno" hidden>
  <h2>Hlubiny tě pohltily</h2>
  <p id="konec-text" class="podtitul"></p>
  <p id="konec-duse" class="konec-duse"></p>
  <div class="radek-tlacitek">
    <button id="znovu" class="menu-tlacitko" type="button">Znovu (R)</button>
    <button id="do-menu" class="menu-tlacitko" type="button">Menu (M)</button>
  </div>
</section>

<p class="napoveda">Pohyb: WASD, šipky nebo tah prstem · zbraně střílí samy · P pauza</p>

    "./src/volba.js": "./src/volba.js?v=3fb72813",
    "./src/vybava.js": "./src/vybava.js?v=21ea81e7",

  }
}
</script>
<script type="module" src="src/main.js?v=28087f44"></script>
</body>
</html>
